name: C++ Release
on:
  push:
    tags: ['v*']

jobs:
  validate_and_package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: config-linux.tar.gz
          - os: windows-latest
            asset: config-windows.zip
          - os: macos-latest
            asset: config-macos.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check_docs.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_CONFIG_BENCHMARK=OFF
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure --parallel 2
      - run: cmake -S . -B package -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_CONFIG_EXAMPLES=OFF
      - run: cmake --install package --prefix install_dist --config Release
      - if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.asset }}" -C install_dist .
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path install_dist\* -DestinationPath "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: validate_and_package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: assets/*
