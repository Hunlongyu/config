name: C++ CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check_docs.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_CONFIG_BENCHMARK=OFF
      - run: cmake --build build --config Debug --parallel 2
      - run: ctest --test-dir build -C Debug --output-on-failure --parallel 2

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCONFIG_SANITIZER=ON -DBUILD_CONFIG_BENCHMARK=OFF
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --parallel 2

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lcov
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON -DBUILD_CONFIG_EXAMPLES=OFF
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --parallel 2
      - run: |
          lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch,gcov
          lcov --extract coverage.info '*/include/config/*' --output-file coverage.info --ignore-errors mismatch,unused
          lcov --remove coverage.info '*/mutant/*' --output-file coverage.info --ignore-errors mismatch,unused
          genhtml coverage.info --output-directory coverage_report --ignore-errors mismatch
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_report/
